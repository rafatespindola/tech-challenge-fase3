spring.application.name=notificacao-service

# Mesmo broker do docker-compose. guest/guest nao serve: o RabbitMQ so aceita
# guest de dentro do proprio container.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:rabbitmq}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:rabbitmq}

# A exchange e do produtor; a fila e os bindings sao deste servico. Lista
# separada por virgula: assinar um evento novo e acrescentar aqui.
lab.rabbitmq.exchange=agendamento.exchange
lab.rabbitmq.queue=agendamentos.notificacao
lab.rabbitmq.binding-patterns=agendamento.criado,agendamento.editado
