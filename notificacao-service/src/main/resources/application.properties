spring.application.name=notificacao-service

# 8080 e do agendamento-service. Sem esta linha o Boot assume 8080 e o segundo
# servico a subir morre com BindException.
server.port=${SERVER_PORT:8081}

# Mesmo broker do docker-compose. guest/guest nao serve: o RabbitMQ so aceita
# guest de dentro do proprio container.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:rabbitmq}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:rabbitmq}

# A exchange e do produtor; a fila e os bindings sao deste servico. Lista
# separada por virgula: assinar um evento novo e acrescentar aqui.
lab.rabbitmq.exchange=agendamento.exchange
lab.rabbitmq.queue=agendamentos.notificacao
lab.rabbitmq.binding-patterns=agendamento.criado,agendamento.editado

# Sem teto de tentativas, uma mensagem que sempre falha volta para a fila na
# velocidade do broker e o consumidor gira em falso: nada atras dela e
# processado e o log cresce em dezenas de MB/s. Com as tentativas espacadas, a
# falha transitoria tem tempo de passar e a permanente para de girar.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=5
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=30s

# Esgotadas as tentativas, a mensagem e descartada em vez de reenfileirada. E o
# que impede o loop de voltar por fora do interceptor de retry.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
