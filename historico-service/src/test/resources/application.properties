# Sobrepoe o application.properties de main: nos testes nao ha MySQL, entao o
# contexto sobe contra H2.
spring.application.name=historico-service

spring.datasource.url=jdbc:h2:mem:historico;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# O mesmo segredo do application.properties de teste do agendamento-service, de
# proposito: JwtServiceTest monta um token com o layout de claims de la e
# confere que este servico o aceita.
jwt.secret=chave-de-teste-do-agendamento-service-com-mais-de-32-caracteres

# Sem estas chaves o @Value de RabbitMQConfig nao resolve e o contexto nao sobe.
# Sao so declaracoes: o RabbitAdmin so tenta cria-las na primeira conexao, que
# nenhum teste abre.
lab.rabbitmq.exchange=agendamento.exchange
lab.rabbitmq.queue=agendamentos.historico
lab.rabbitmq.binding-patterns=agendamento.*

# Sem broker no ambiente de teste, o RabbitHealthIndicator reportaria DOWN.
management.health.rabbit.enabled=false

# Sem isto o container do @RabbitListener tenta conectar no start e derruba o
# contexto ('Failed to start bean internalRabbitListenerEndpointRegistry'), ja
# que nao existe broker no ambiente de teste.
spring.rabbitmq.listener.simple.auto-startup=false
