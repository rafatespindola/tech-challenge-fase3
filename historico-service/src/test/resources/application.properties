# Sem estas chaves o @Value de RabbitMQConfig nao resolve e o contexto nao sobe.
# Sao so declaracoes: o RabbitAdmin so tenta cria-las na primeira conexao, que
# nenhum teste abre.
lab.rabbitmq.exchange=agendamento.exchange
lab.rabbitmq.queue=agendamentos.historico
lab.rabbitmq.binding-patterns=agendamento.*

# Sem broker no ambiente de teste, o RabbitHealthIndicator reportaria DOWN.
management.health.rabbit.enabled=false
