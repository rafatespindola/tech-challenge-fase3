spring.application.name=historico-service

# 8080 e do agendamento-service e 8081 do notificacao-service. Sem esta linha o
# Boot assume 8080 e o segundo servico a subir morre com BindException.
server.port=${SERVER_PORT:8082}

# Base propria, no container mysql-historico do docker-compose. Fora do host o
# 3307 vira 3306; por isso host e porta sao variaveis.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:historico}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USER:historico}
spring.datasource.password=${DB_PASSWORD:historico}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# update, e nao create-drop como no agendamento-service: o historico existe
# justamente para sobreviver ao restart do servico.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Mesmo broker do docker-compose. guest/guest nao serve: o RabbitMQ so aceita
# guest de dentro do proprio container.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:rabbitmq}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:rabbitmq}

# Sem retry, uma falha transitoria do banco devolve a mensagem para a fila e ela
# reentra em loop fechado, ocupando o consumidor. Com as tentativas espacadas, o
# banco tem tempo de voltar; o messageId garante que a repeticao nao duplique a
# linha.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=5
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=30s

# A exchange e do produtor; a fila e o binding sao deste servico.
lab.rabbitmq.exchange=agendamento.exchange
lab.rabbitmq.queue=agendamentos.historico
lab.rabbitmq.binding-patterns=agendamento.*

# Mesmo segredo do agendamento-service, e nao um proprio: e ele que faz o token
# emitido la ser aceito aqui. O default abaixo e byte a byte o default de la,
# para o ambiente local funcionar sem exportar nada; em qualquer outro ambiente
# os dois servicos tem que receber o mesmo JWT_SECRET.
# Nao ha jwt.expiracao-minutos: este servico nao emite token, so confere.
jwt.secret=${JWT_SECRET:troque-esta-chave-de-desenvolvimento-do-agendamento-service}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
