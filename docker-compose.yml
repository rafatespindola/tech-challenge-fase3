services:
  mysql-agendamento:
    image: mysql:8.4
    container_name: mysql-agendamento
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: agendamento
      MYSQL_USER: agendamento
      MYSQL_PASSWORD: agendamento
    ports:
      - "3306:3306"
    volumes:
      - mysql-agendamento-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql-agendamento-data:
