# Sobrepoe o application.properties de main: nos testes nao ha MySQL nem as
# variaveis DB_HOST/DB_USER/DB_PASSWORD, entao o contexto sobe contra H2.
spring.application.name=agendamento-service

spring.datasource.url=jdbc:h2:mem:agendamento;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# O data.sql usa INSERT IGNORE, sintaxe exclusiva do MySQL.
spring.sql.init.mode=never

# Este arquivo substitui o application.properties principal, entao o segredo
# precisa ser repetido aqui: sem ele o JwtService derruba todo @SpringBootTest.
jwt.secret=chave-de-teste-do-agendamento-service-com-mais-de-32-caracteres
jwt.expiracao-minutos=120
