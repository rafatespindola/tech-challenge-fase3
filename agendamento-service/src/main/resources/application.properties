spring.application.name=agendamento-service
server.port=8080

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# create-drop = DROP + CREATE no startup e DROP no shutdown gracioso.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Executa o data.sql depois que o Hibernate cria as tabelas. Sem defer, o
# script rodaria antes do schema existir.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Console de exploracao do schema em http://localhost:8080/graphiql
spring.graphql.graphiql.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
# Chave HMAC do JWT. Precisa de no minimo 32 caracteres (HS256) e deve ser
# trocada por JWT_SECRET fora do ambiente de desenvolvimento: quem tem esta
# string emite tokens validos.
jwt.secret=${JWT_SECRET:troque-esta-chave-de-desenvolvimento-do-agendamento-service}
jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:120}

# Conexao com o broker do docker-compose. O guest/guest default do Boot nao
# serve: o RabbitMQ so aceita guest de dentro do proprio container.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:rabbitmq}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:rabbitmq}

# So o que um produtor precisa: onde publicar e com que prefixo. Fila e binding
# sao declarados por cada consumidor, nao aqui.
lab.rabbitmq.exchange=agendamento.exchange
# O prefixo e a primeira palavra da routing key; o sufixo vem do enum
# AgendamentoEvento. Curinga nao vale na publicacao, so em binding.
lab.rabbitmq.routing-key-prefix=agendamento
